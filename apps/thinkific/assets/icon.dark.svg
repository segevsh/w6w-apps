<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Thinkific">
  <!-- Plate: the vendor mark (assets/icon.png, verbatim) is dark ink on a
       transparent ground, which disappears on the dark app tile. This composes
       the untouched raster on a white backdrop rather than re-inking it, so the
       artwork itself never changes -- see _tools/icon-legibility.ts header doc,
       "the backdrop colour and the inset are brand decisions". -->
  <rect width="180" height="180" rx="32" fill="#ffffff"/>
  <image href="data:image/png;base64," x="0" y="0" width="180" height="180"/>
</svg>
