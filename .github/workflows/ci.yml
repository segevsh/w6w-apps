name: CI

# Every check lives in scripts/verify.sh, which the pre-push hook (w6w-io/w6w
# .githooks/pre-push) also runs. It tests and builds only the apps a change touches (all of
# them when a shared file changes), building with the same pinned w6w-core that
# `Reload apps` uses after merge — so a PR that is green here publishes cleanly. The job id
# `verify` is the required-check context branch protection names on every w6w-io repo.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only a PR run is superseded by a newer one. A push run verifies just the apps its own push
  # changed (VERIFY_BASE = the previous tip), so cancelling it would leave that push unchecked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # apps/postgres's golden-path runtime test logs in to a real PostgreSQL 16 server (the
    # devcontainer's `postgres` service locally); this is that server for CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: apps
          fetch-depth: 0
      # Full history: verify.sh diffs against VERIFY_BASE, and checks out the SHA
      # reload-apps.yml pins as a worktree of ../core.
      - uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          path: core
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pack's shared tooling
        working-directory: apps
        run: npm ci --no-audit --no-fund
      - name: Verify
        working-directory: apps
        # The apps to verify are the ones changed since VERIFY_BASE: the PR's base, or on a push
        # the tip before it (every commit of the push, not only the last). A base this checkout
        # lacks (a manual run, a force-push, a new branch's all-zero `before`) falls back to HEAD~1.
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
          W6W_TEST_PG_HOST: 127.0.0.1
        run: |
          if ! git cat-file -e "$VERIFY_BASE^{commit}" 2>/dev/null; then
            echo "::notice::VERIFY_BASE $VERIFY_BASE is not in this checkout; using HEAD~1"
            VERIFY_BASE=HEAD~1
          fi
          bash scripts/verify.sh
