name: Reload apps

# ---------------------------------------------------------------------------
# On every push to main:
#   1. builds every app in w6w-pack.json ONCE (app-build);
#   2. downloads the remote index apps/index.json from the blob bucket (what the
#      last successful run published, per app);
#   3. compares digests to find the apps that changed;
#   4. uploads only those apps' artifacts, overwriting any already in the bucket;
#   5. makes ONE publish-index call so the production w6w API reloads them;
#   6. rewrites apps/index.json once the API has accepted them;
# then, only if something changed, dispatches a rebuild of w6w-frontend so its
# app pages pick up the change with no human step in between.
#
# The index is written AFTER the API call (not before): a failed or unreachable
# publish then leaves those apps "changed", and the next run sends them again.
#
# Builder source: @w6w/app-build is NOT on JSR (meta.json -> 404, checked
# 2026-10-24), so this checks out w6w-io/w6w-core as a sibling of the apps
# checkout (apps/<id>/deno.json maps ../../../core/packages/types) at a PINNED
# commit sha and runs its packages/app-build/cli.ts. Bump the sha deliberately.
#
# The publish lives in .github/scripts/publish-apps.mjs; this file is the
# trigger, tool setup, and env wiring. The frontend dispatch is a plain
# GitHub-to-GitHub API call (workflow_dispatch on w6w-frontend's Build +
# Deploy workflow) with a short-lived installation token from a GitHub App
# installed on both repos.
#
# BEFORE THIS WORKFLOW DOES ANYTHING USEFUL, a human needs to configure on
# this repo's (w6w-io/w6w-apps) settings:
#   - Repo variable  W6W_API_URL        — the production API base URL (not secret)
#   - Repo variable  GCP_WIF_PROVIDER   — Workload Identity provider resource name
#   - Repo variable  GCP_PUBLISHER_SA   — service account email. On the blob bucket it
#                                         creates, reads and overwrites objects under apps/
#                                         (objectCreator alone can't overwrite)
#   - Repo secret    OPS_JWT_SECRET     — signs short-lived ops JWTs (same key
#                                         GCP Secret Manager's `ops-jwt-secret` holds)
#   - Repo secret    APP_ID             — the w6w-ci-bot GitHub App's ID (or client ID)
#   - Repo secret    APP_PRIVATE_KEY    — that App's private key (.pem)
# The App must be installed on w6w-io/w6w-frontend with `actions: write`.
# ---------------------------------------------------------------------------

on:
  # Manual re-run. Publishing is idempotent (uploads overwrite, publish-index
  # skips current entries), so this is the retry path for a transient failure.
  # `full` ignores apps/index.json and sends every app (the API still skips the
  # ones it holds): the recovery path when the catalog and the index disagree.
  workflow_dispatch:
    inputs:
      full:
        description: "Send every app, ignoring apps/index.json"
        type: boolean
        default: false
  push:
    branches: [main]
    # Path-filtered: this triggers a LIVE write against the production
    # catalog, so a push touching only .github/ itself, root docs, etc.
    # shouldn't fire it.
    paths:
      - "apps/**"
      - "w6w-pack.json"

# A burst of pushes to main should not cancel a publish that is already
# partway through; the next push's run queues behind it.
concurrency:
  group: reload-apps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  reload:
    # Fork guard: this workflow reaches PRODUCTION and a personal fork
    # carries none of the secrets/variables it needs.
    if: github.repository == 'w6w-io/w6w-apps'
    name: Reload apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: w6w-apps

      # Sibling of w6w-apps (see header). Pinned by sha, not branch.
      - uses: actions/checkout@v6
        with:
          repository: w6w-io/w6w-core
          ref: b35a5f7b2323702507169642ad7c51a7e79f5273
          path: core

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # deno bundle installs its esbuild binary into the cache on first use; when
      # app-build starts many bundles at once they race on that copy and one
      # fails ("failed to copy esbuild binary ... No such file or directory").
      # One serial bundle first leaves the binary in place for all of them.
      - name: Test the publish script
        working-directory: w6w-apps
        run: node --test .github/scripts/publish-apps.test.mjs

      - name: Pre-warm deno bundle (esbuild binary)
        working-directory: core
        run: |
          d="$(mktemp -d)"
          echo 'export const warm = 1;' > "$d/warm.ts"
          deno bundle -q -o "$d/warm.js" "$d/warm.ts"

      - name: Build every app once
        working-directory: core
        run: >-
          deno run -A --unstable-worker-options packages/app-build/cli.ts
          --pack ../w6w-apps/w6w-pack.json -o dist --minify

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SA }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload changed apps, notify the API, update apps/index.json
        id: publish
        working-directory: core
        env:
          W6W_API_URL: ${{ vars.W6W_API_URL }}
          OPS_JWT_SECRET: ${{ secrets.OPS_JWT_SECRET }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: node ../w6w-apps/.github/scripts/publish-apps.mjs $FULL

      # Only reached if the publish step succeeded. Mints a token scoped to
      # ONLY w6w-frontend. Skipped when a PUSH changed nothing in the catalog
      # (`changed=0`); a `workflow_dispatch` always rebuilds (it is the retry
      # after a failed push run that may already have published the apps).
      - name: Mint a token scoped to w6w-frontend
        if: steps.publish.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: w6w-io
          repositories: w6w-frontend

      - name: Trigger the frontend rebuild
        if: steps.publish.outputs.changed != '0' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run "Build + Deploy" --repo w6w-io/w6w-frontend --ref main
